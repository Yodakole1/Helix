[package]
name = "app"
version = "0.1.0"
description = "Helix, a privacy-focused cross-platform email client"
authors = ["Konstantin Nikolic"]
license = "GPL-3.0-only"
repository = "https://github.com/Yodakole1/Helix"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio", "tokio"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-native-tls = "0.3.1"
futures = "0.3.32"
imap-proto = "0.16.7"
chrono = "0.4.45"
zeroize = "1.8.2"
rfc2047-decoder = "1.1.2"
mail-parser = { version = "0.11.3", features = ["full_encoding", "serde"] }
lettre = { version = "0.11.19", default-features = false, features = ["tokio1-native-tls", "smtp-transport", "builder", "hostname"] }
hickory-resolver = "0.25.2"
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher"] }
rand = "0.8"
dirs = "5"
pgp = "0.19"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "blocking"] }
sha1 = "0.10"
openssl = { version = "0.10", features = ["vendored"] }
openssl-sys = { version = "0.9", features = ["vendored"] }
quick-xml = "0.37"
# OAuth2 sign-in opens the provider's consent page in the system browser
# (RFC 8252 native-app flow) -- an embedded webview would be blocked by
# Google outright and would bypass the user's password manager.
open = "5"
# App-lock password hashing (memory-hard KDF; a plain hash would make the
# lock password trivially brute-forceable if the cache leaked).
argon2 = "0.5"
# App-lock passkey support: raw FIDO2/CTAP2 over USB HID (WebAuthn isn't
# reliably available inside the system webview). Optional because its
# hidapi build needs libudev headers on Linux (libudev-dev) -- see
# docs/technical/setup.md. Without the feature the passkey commands exist
# but return a clear "not built with passkey support" error.
ctap-hid-fido2 = { version = "3", optional = true }

[features]
default = []
passkey = ["dep:ctap-hid-fido2"]

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
